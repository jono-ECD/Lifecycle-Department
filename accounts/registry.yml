# Account Registry — single source of truth for account identity and data access.
#
# Every agent, workflow, and report resolves a client through THIS file.
# Never hardcode an account ID in a workflow, skill, or script; look it up here.
# Adding an account = one entry here + one folder under accounts/<slug>/.
#
# verified: has the klaviyo_account_id been confirmed against the live API?
#   true  = confirmed via accounts endpoint
#   false = supplied by a human, not yet confirmed — treat as provisional
#
# owner: the named person who authorizes agent actions on this account.
#   null = nobody has been named. The account is capped at read_only until
#   someone is. This is a real gate, enforced by scripts/sync.py.
#
# agent_access: the ceiling on what an agent may do here. See
# integrations/mcp/access-policy.md for what each class means.
#   none      = no agent access at all
#   read_only = reads permitted, no writes            <- the default
#   draft     = may also create unpublished drafts     (requires an owner)
# Scheduling, sending and activating are never in this field. They are
# human-only, per instance, and cannot be delegated to an agent.
#
# Last verification pass: 2026-09-20

